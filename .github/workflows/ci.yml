name: Engineering checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: debategraph
          POSTGRES_PASSWORD: debategraph
          POSTGRES_DB: debategraph
        ports: [5433:5432]
        options: --health-cmd="pg_isready -U debategraph" --health-interval=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check backend scripts
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://debategraph:debategraph@localhost:5433/debategraph
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
