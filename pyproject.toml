[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "debategraph"
version = "0.1.0"
description = "Evidence-grounded educational debate orchestration with LangGraph"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.54,<1", "langgraph>=1,<2",
 "langchain-openai>=1,<2", "langchain-text-splitters>=1,<2", "pydantic-settings>=2,<3",
 "sqlalchemy>=2,<3", "pgvector>=0.4,<1", "psycopg[binary]>=3,<4",
 "langgraph-checkpoint-sqlite>=3,<4", "langgraph-checkpoint-postgres>=3,<4",
 "httpx>=0.28,<1", "beautifulsoup4>=4,<5", "pypdf>=6,<7", "python-docx>=1,<2", "tiktoken>=0.12,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]
studio = ["langgraph-cli[inmem]>=0.4,<1"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 110
